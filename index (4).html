<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1859e8">
<meta name="description" content="Demo interactiva de Tablero: tableros, tarjetas, plazos y traslado entre tableros.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231859e8'/%3E%3Crect x='104' y='104' width='132' height='304' rx='28' fill='%23fff'/%3E%3Crect x='276' y='104' width='132' height='200' rx='28' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<title>Tablero Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior blanca, tablero a pantalla completa con columnas horizontales sobre azul, panel lateral de traslado */
/* Paleta deliberada de un solo mundo: blanco y azul (pedido explícito), sin modo oscuro */
:root {
  --white: #ffffff;
  --mist: #eef4ff;        /* fondos suaves con tinte azul */
  --line: #d6e2f7;
  --ink: #0d2350;         /* texto principal azul muy oscuro */
  --ink-2: #4a5f86;       /* texto secundario */
  --blue: #1859e8;        /* acento principal */
  --blue-deep: #0b3aa8;
  --blue-soft: #dbe7ff;
  --red: #d93b3b; --amber: #e8a317; --green: #1c8a5a;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --shadow: 0 1px 2px rgba(13,35,80,.12), 0 0 0 1px rgba(13,35,80,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body { background: var(--white); color: var(--ink); font: 14px/1.45 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: transparent; }
input[type=checkbox] { width: auto; accent-color: var(--blue); }
textarea { resize: vertical; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--white); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--blue-deep); background: none; border: 0; padding: 0; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--blue); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 5px; }
.logo i { background: var(--white); border-radius: 2px; }
.logo i:last-child { height: 65%; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 7px 10px; border-radius: 7px; font-weight: 600; color: var(--ink-2); }
.nav button.on, .nav button:hover { background: var(--mist); color: var(--blue-deep); }
.as { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.as select { width: auto; max-width: 230px; padding: 6px 8px; }
.as label { font-size: 12px; color: var(--ink-2); white-space: nowrap; }

.btn { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--mist); color: var(--blue-deep); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--blue-soft); }
.btn.primary { background: var(--blue); color: var(--white); }
.btn.primary:hover { background: var(--blue-deep); }
.btn.danger { background: #fde8e8; color: var(--red); }
.btn.on-blue { background: rgba(255,255,255,.18); color: var(--white); }
.btn.on-blue:hover, .btn.on-blue.on { background: rgba(255,255,255,.32); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--mist); color: var(--blue-deep); letter-spacing: .02em; }
.pill.on-blue { background: rgba(255,255,255,.2); color: var(--white); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--white); font-weight: 700; font-size: 11px; flex: none; border: 2px solid var(--white); }
.avatars { display: flex; }
.avatars .avatar + .avatar { margin-left: -7px; }

/* inicio */
.page { flex: 1; overflow-y: auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.intro { background: var(--blue); color: var(--white); border-radius: 14px; padding: 22px 24px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; }
.intro h1 { font-size: 24px; margin-bottom: 6px; }
.intro p { margin: 0; max-width: 60ch; color: #dbe7ff; }
.intro ol { margin: 0; padding-left: 18px; color: #eaf1ff; display: flex; flex-direction: column; gap: 5px; }
.intro b { color: var(--white); }
.alert { border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 10px; padding: 12px 14px; background: var(--white); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head h2 { font-size: 18px; }
.area-name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 8px; }
.area-name i { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tile { height: 104px; border: 0; border-radius: 12px; padding: 12px 14px; color: var(--white); text-align: left; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--f-display); font-weight: 600; font-size: 15px; box-shadow: var(--shadow); transition: transform .12s; }
.tile:hover { transform: translateY(-2px); }
.tile small { font-family: var(--f-body); font-weight: 500; font-size: 12px; opacity: .9; }
.tile.new { background: var(--mist); color: var(--blue-deep); align-items: center; justify-content: center; border: 1.5px dashed var(--line); box-shadow: none; }
.tile.locked { background: var(--white); color: var(--ink-2); border: 1px solid var(--line); box-shadow: none; cursor: default; }
.tile.locked:hover { transform: none; }

/* tablero */
.board { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bbg, var(--blue)); }
.board-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(5,20,60,.22); color: var(--white); }
.board-bar h1 { font-size: 18px; color: var(--white); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.filters input, .filters select { width: auto; min-width: 150px; border: 0; padding: 6px 10px; background: rgba(255,255,255,.95); }
.filters .note { color: #e3ecff; font-size: 12px; }
.board-body { flex: 1; display: flex; min-height: 0; }
.lists { flex: 1; display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-block: 6px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scroll-snap-type: x proximity; }
.list { flex: 0 0 278px; max-height: 100%; display: flex; flex-direction: column; background: var(--mist); border-radius: 12px; padding: 8px; scroll-snap-align: start; }
.list.over { box-shadow: inset 0 0 0 2px var(--amber); }
.list-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 8px; cursor: grab; }
.list-head b { font-family: var(--f-display); font-size: 14px; flex: 1; }
.count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; background: var(--white); border-radius: 99px; padding: 1px 8px; }
.cards { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 12px; padding: 2px; }
.card { background: var(--white); border-radius: 9px; box-shadow: var(--shadow); padding: 9px 10px; cursor: pointer; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.card:hover { box-shadow: 0 0 0 2px var(--blue); }
.card .cover { height: 26px; margin: -9px -10px 8px; }
.card-title { font-weight: 500; overflow-wrap: anywhere; }
.labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.lbl { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 5px; color: var(--white); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 7px; font-size: 12px; color: var(--ink-2); }
.bdg { padding: 1px 6px; border-radius: 5px; background: var(--mist); font-variant-numeric: tabular-nums; }
.bdg.overdue { background: var(--red); color: var(--white); }
.bdg.soon { background: var(--amber); color: var(--ink); }
.bdg.done { background: var(--green); color: var(--white); }
.ghost { opacity: .35; }
.chosen .card, .card.chosen { box-shadow: 0 10px 26px rgba(5,20,60,.3); transform: rotate(2deg); }
.add { background: none; border: 0; text-align: left; padding: 8px; border-radius: 8px; color: var(--ink-2); font-weight: 600; width: 100%; }
.add:hover { background: var(--blue-soft); color: var(--blue-deep); }
.add-list { flex: 0 0 278px; background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px; }
.add-list .add { color: var(--white); }
.add-list .add:hover { background: rgba(255,255,255,.2); }
.addform { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }

.tray { flex: 0 0 270px; background: var(--white); margin: 6px 16px 24px 0; margin-right: max(16px, env(safe-area-inset-right, 0px)); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; box-shadow: var(--shadow); }
.tray h3 { font-size: 15px; }
.drop { border: 2px dashed var(--line); border-radius: 9px; padding: 14px 10px; font-weight: 600; color: var(--ink-2); min-height: 52px; transition: .15s; }
.drop .card { margin-top: 8px; opacity: .6; }
.drop:has(.card) { border-color: var(--blue); background: var(--mist); color: var(--blue-deep); }
input[type=radio]:checked + .sw { border-color: var(--ink); }

/* modales */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(9,25,66,.5); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 40px max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px)); }
.modal { position: relative; width: 100%; max-width: 820px; background: var(--white); border-radius: 14px; padding: 22px; box-shadow: 0 20px 50px rgba(5,20,60,.35); }
.modal.narrow { max-width: 520px; }
.x { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 24px; line-height: 1; color: var(--ink-2); padding: 4px 8px; border-radius: 6px; }
.x:hover { background: var(--mist); }
.m-cover { height: 70px; margin: -22px -22px 16px; border-radius: 14px 14px 0 0; }
.title-input { font-family: var(--f-display); font-size: 20px; font-weight: 600; border-color: transparent; padding: 4px 6px; margin-left: -6px; width: calc(100% - 30px); resize: none; line-height: 1.3; field-sizing: content; min-height: 0; }
.title-input:hover { border-color: var(--line); }
.cm-layout { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 22px; margin-top: 12px; }
.sec { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.sec h4 { font-size: 14px; }
.lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 16px; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--mist); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width .2s; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.items li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.items li.done span { text-decoration: line-through; color: var(--ink-2); }
.icon { background: none; border: 0; color: var(--ink-2); padding: 2px 7px; border-radius: 6px; }
.icon:hover { background: var(--mist); color: var(--red); }
.comments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.comments li { display: flex; gap: 8px; }
.bubble { border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.side { display: flex; flex-direction: column; gap: 6px; }
.side .btn { text-align: left; width: 100%; }
.pick { border: 1px solid var(--line); border-radius: 9px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.pick label { display: flex; align-items: center; gap: 7px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 34px; height: 24px; border-radius: 6px; border: 2px solid transparent; }
.sw.on { border-color: var(--ink); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.log li { display: flex; gap: 8px; align-items: flex-start; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--mist); }
.mrow select { width: auto; }
.myc { display: flex; flex-direction: column; gap: 18px; }
.myc ul { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
.myc li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--mist); flex-wrap: wrap; }
.myc li:first-child { border-top: 0; }
.link { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 600; text-align: left; }
.link:hover { text-decoration: underline; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--blue-deep); color: var(--white); padding: 10px 16px; border-radius: 10px; z-index: 100; box-shadow: 0 8px 22px rgba(5,20,60,.35); max-width: calc(100% - 32px); font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

@media (max-width: 760px) {
  .intro, .two, .cm-layout, .dates { grid-template-columns: 1fr; }
  .as { margin-left: 0; width: 100%; }
  .as select { max-width: none; flex: 1; }
  .lists { scroll-snap-type: x mandatory; }
  .list, .add-list { flex-basis: 84vw; }
  .board-body { flex-direction: column; }
  .tray { margin: 0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); flex: none; max-height: 42vh; }
  .overlay { padding: 0; }
  .modal { border-radius: 0; min-height: 100%; }
  .m-cover { border-radius: 0; }
  .filters input, .filters select { flex: 1 1 140px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(() => {
'use strict';
const KEY = 'tablero-demo-v1';
const BG = ['#1859e8', '#0b3aa8', '#2f7cf6', '#0a2a6e', '#3a6fd8', '#1d4ed8'];
const LABEL_COLORS = ['#d93b3b', '#1859e8', '#e8a317', '#1c8a5a', '#6b7a99', '#7aa7ff'];
const ROLE = { admin: 'Admin', member: 'Miembro', observer: 'Observador' };

// ---------- utilidades ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let seq = Date.now();
const uid = (p) => p + (seq++).toString(36);
const pad = (n) => String(n).padStart(2, '0');
function rel(days, h = 18, m = 0) {
  const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(h)}:${pad(m)}`;
}
const fmt = (s, time = true) => s ? new Date(s).toLocaleString('es-AR', time ? { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' } : { day: 'numeric', month: 'short' }) : '';
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
const initials = (n) => n.split(' ').slice(0, 2).map((w) => w[0]).join('').toUpperCase();

// ---------- datos de ejemplo ----------
function seed() {
  const now = Date.now();
  const users = [
    { id: 'u1', name: 'Ana Gómez', job: 'Gerencia', ws: 'owner', color: '#1859e8' },
    { id: 'u2', name: 'Bruno Díaz', job: 'Ventas', ws: 'member', color: '#0b3aa8' },
    { id: 'u3', name: 'Carla Ruiz', job: 'Administración', ws: 'member', color: '#3a8dde' },
    { id: 'u4', name: 'Diego Paz', job: 'Depósito', ws: 'member', color: '#5b6fa8' }
  ];
  const areas = [
    { id: 'a1', name: 'Ventas', members: ['u1', 'u2'] },
    { id: 'a2', name: 'Administración', members: ['u1', 'u3'] },
    { id: 'a3', name: 'Depósito', members: ['u4'] }
  ];
  const mkLabels = () => [
    { id: uid('l'), name: 'Urgente', color: LABEL_COLORS[0] },
    { id: uid('l'), name: 'Cliente', color: LABEL_COLORS[1] },
    { id: uid('l'), name: 'Pago', color: LABEL_COLORS[2] },
    { id: uid('l'), name: 'Listo para revisar', color: LABEL_COLORS[3] }
  ];
  const boards = [
    { id: 'b1', title: 'Ventas · Pipeline', area: 'a1', vis: 'area', bg: BG[0], members: { u1: 'admin', u2: 'member', u3: 'observer' }, labels: mkLabels() },
    { id: 'b2', title: 'Administración', area: 'a2', vis: 'private', bg: BG[1], members: { u1: 'admin', u3: 'member' }, labels: mkLabels() },
    { id: 'b3', title: 'Coordinación entre áreas', area: null, vis: 'workspace', bg: BG[2], members: { u1: 'admin', u2: 'member', u3: 'member', u4: 'member' }, labels: mkLabels() },
    { id: 'b4', title: 'Depósito y logística', area: 'a3', vis: 'private', bg: BG[3], members: { u1: 'admin', u4: 'member' }, labels: mkLabels() }
  ];
  const lists = []; const cards = [];
  const cols = ['Pendiente', 'En curso', 'En revisión', 'Hecho'];
  for (const b of boards) cols.forEach((t, i) => lists.push({ id: `${b.id}-l${i}`, board: b.id, title: t, pos: (i + 1) * 1000, limit: null, archived: false }));
  const L = (b, i) => b.labels[i].id;
  const add = (b, col, title, o = {}) => cards.push({
    id: uid('c'), board: b.id, list: `${b.id}-l${col}`, title, desc: o.desc || '', start: o.start || '', due: o.due || '',
    done: !!o.done, members: o.members || [], labels: o.labels || [], cover: o.cover || '',
    checklist: (o.check || []).map((t) => ({ id: uid('i'), text: t[0], done: t[1] })),
    comments: (o.comments || []).map((c) => ({ id: uid('m'), u: c[0], text: c[1], at: now - c[2] * 60000 })),
    archived: false, pos: cards.filter((c) => c.list === `${b.id}-l${col}`).length * 1000 + 1000
  });
  const [b1, b2, b3, b4] = boards;
  add(b1, 0, 'Enviar presupuesto a Ferretería Norte', { due: rel(-1, 17), members: ['u2'], labels: [L(b1, 0), L(b1, 1)], desc: 'Pidieron 40 cajas de tornillería y entrega en 10 días. Confirmar precio con Administración antes de enviar.', check: [['Armar planilla de precios', true], ['Validar descuento con Ana', false], ['Enviar por email', false]], comments: [['u1', 'Podemos ofrecer 8 % si pagan a 30 días.', 95]] });
  add(b1, 0, 'Llamar a clientes inactivos de octubre', { due: rel(3), members: ['u2'], check: [['Lista de 12 clientes', true], ['Llamadas', false]] });

try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.users) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ } };

const ui = { view: 'home', board: null, card: null, panel: null, adding: null, addingList: false, newBoard: false,

// ---------- consultas y permisos ----------
const user = (id) => S.users.find((u) => u.id === id);
const board = (id) => S.boards.find((b) => b.id === id);
const list = (id) => S.lists.find((l) => l.id === id);
const card = (id) => S.cards.find((c) => c.id === id);
const me = () => user(S.me);
const wsAdmin = () => ['owner', 'admin'].includes(me().ws);
const role = (b) => b.members[S.me];
const canView = (b) => !!role(b) || wsAdmin() || b.vis === 'workspace' || (b.vis === 'area' && S.areas.find((a) => a.id === b.area)?.members.includes(S.me));
const canEdit = (b) => ['admin', 'member'].includes(role(b)) || wsAdmin();
const isAdmin = (b) => role(b) === 'admin' || wsAdmin();
const listsOf = (bid) => S.lists.filter((l) => l.board === bid && !l.archived).sort((a, b) => a.pos - b.pos);
const cardsOf = (lid) => S.cards.filter((c) => c.list === lid && !c.archived).sort((a, b) => a.pos - b.pos);
function dueStatus(c) {
  if (!c.due) return null;
  if (c.done) return 'done';
  const ms = new Date(c.due) - Date.now();
  return ms < 0 ? 'overdue' : ms < 864e5 ? 'soon' : 'ok';
}
function log(bid, cid, text) { S.activity.unshift({ id: uid('a'), board: bid, card: cid, u: S.me, text, at: Date.now() }); }

function avatar(id, size = 28) {
  const u = user(id); if (!u) return '';
  return `<span class="avatar" title="${esc(u.name)}" style="background:${u.color};width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px">${initials(u.name)}</span>`;
}
function visLabel(b) {
  if (b.vis === 'private') return 'Privado';
  if (b.vis === 'area') return 'Área ' + (S.areas.find((a) => a.id === b.area)?.name || '');
  return 'Toda la empresa';
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200);
}

function filtering() { const f = ui.filter; return !!(f.text || f.member || f.label || f.due); }
function visible(c) {
  const f = ui.filter;
  if (f.text && !c.title.toLowerCase().includes(f.text.toLowerCase())) return false;
  if (f.member && !c.members.includes(f.member)) return false;
  if (f.label && !c.labels.includes(f.label)) return false;
  if (f.due) {
    const s = dueStatus(c);
    if (f.due === 'none' && c.due) return false;
    if (f.due === 'overdue' && s !== 'overdue') return false;
    if (f.due === 'soon' && s !== 'soon') return false;
    if (f.due === 'done' && s !== 'done') return false;
  }
  return true;
}

function cardTile(c, b) {
  const done = c.checklist.filter((i) => i.done).length;
  const s = dueStatus(c);
  const labels = c.labels.map((id) => b.labels.find((l) => l.id === id)).filter(Boolean);
  return `<article class="card" data-id="${c.id}" data-a="open-card" tabindex="0">
    ${c.cover ? `<div class="cover" style="background:${c.cover}"></div>` : ''}
    ${labels.length ? `<div class="labels">${labels.map((l) => `<span class="lbl" style="background:${l.color}">${esc(l.name)}</span>`).join('')}</div>` : ''}
    <div class="card-title">${esc(c.title)}</div>

      ${c.due ? `<span class="bdg ${s}">${s === 'done' ? '✓ ' : ''}${fmt(c.due, false)}</span>` : ''}

      ${c.comments.length ? `<span class="bdg">💬 ${c.comments.length}</span>` : ''}

}

// ---------- arrastrar y soltar ----------
function initDnD() {
  if (typeof Sortable === 'undefined') return;
  const b = board(ui.board);
  const off = !canEdit(b) || filtering();
  const opts = { animation: 160, delay: 180, delayOnTouchOnly: true, ghostClass: 'ghost', chosenClass: 'chosen', disabled: off, forceFallback: true, fallbackTolerance: 4 };
  document.querySelectorAll('.lists > .list .cards').forEach((el) => new Sortable(el, { ...opts, group: 'cards', onEnd: onCardDrop }));
  new Sortable(document.querySelector('.lists'), { ...opts, handle: '.list-head', draggable: '.list', onEnd: onListDrop });
  document.querySelectorAll('.drop').forEach((el) => new Sortable(el, {
    group: { name: 'cards', pull: false, put: true }, ghostClass: 'ghost',
    onAdd: (e) => { const id = e.item.dataset.id; e.item.remove(); transfer(id, el.dataset.drop, ui.trayCopy); }
  }));
}
function onCardDrop(e) {
  if (e.to.classList.contains('drop')) return;
  const changed = new Set([e.from, e.to]);
  for (const el of changed) {
    const lid = el.dataset.list;
    [...el.querySelectorAll('.card')].forEach((node, i) => {
      const c = card(node.dataset.id);
      if (c.list !== lid) log(c.board, c.id, `movió la tarjeta de “${list(c.list).title}” a “${list(lid).title}”`);
      c.list = lid; c.pos = (i + 1) * 1000;
    });
  }
  render();
}
function onListDrop() {
  [...document.querySelectorAll('.lists > .list')].forEach((node, i) => { list(node.dataset.list).pos = (i + 1) * 1000; });
  render();
}
function transfer(cardId, targetList, copy) {
  const c = card(cardId); const tl = list(targetList); const tb = board(tl.board); const sb = board(c.board);
  if (!canEdit(tb)) { toast('No tenés permiso de edición en el tablero destino.'); render(); return; }
  if (!copy && !canEdit(sb)) { toast('No tenés permiso para mover tarjetas de este tablero.'); render(); return; }
  const mapLabel = (lid) => {
    const l = sb.labels.find((x) => x.id === lid); if (!l) return null;
    let t = tb.labels.find((x) => x.name === l.name && x.color === l.color);
    if (!t) { t = { id: uid('l'), name: l.name, color: l.color }; tb.labels.push(t); }
    return t.id;
  };
  const pos = Math.max(0, ...cardsOf(tl.id).map((x) => x.pos)) + 1000;
  const labels = c.labels.map(mapLabel).filter(Boolean);
  const members = c.members.filter((u) => tb.members[u]);
  if (copy) {
    const n = { ...c, id: uid('c'), board: tb.id, list: tl.id, pos, labels, members, comments: [], archived: false, checklist: c.checklist.map((i) => ({ ...i, id: uid('i') })) };
    S.cards.push(n);
    log(sb.id, c.id, `copió “${c.title}” al tablero “${tb.title}”`);
    log(tb.id, n.id, `copió “${c.title}” desde el tablero “${sb.title}”`);
  } else {
    const removed = c.members.length - members.length;
    Object.assign(c, { board: tb.id, list: tl.id, pos, labels, members });
    log(sb.id, null, `trasladó “${c.title}” al tablero “${tb.title}”`);
    log(tb.id, c.id, `trasladó “${c.title}” desde el tablero “${sb.title}”`);
    if (removed) setTimeout(() => toast(`Se quitaron ${removed} miembro(s) que no pertenecen a “${tb.title}”.`), 3300);
  }
  toast(copy ? `Tarjeta copiada a “${tb.title}” · ${tl.title}` : `Tarjeta trasladada a “${tb.title}” · ${tl.title}`);
  render();
}
